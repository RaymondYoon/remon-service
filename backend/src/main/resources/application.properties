spring.application.name=remon-service

# DB 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway 마이그레이션
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
# 운영: 마이그레이션 오류를 숨기지 않도록 repair-on-migrate / out-of-order 사용 안 함
# (로컬 개발용 완화 설정은 application-local.properties 에 있음)

# 서버
server.port=${PORT:8080}

# JVM 메모리 설정
spring.jvm.heap-size.initial=128m
spring.jvm.heap-size.max=400m

# JWT 설정 (운영 환경에서는 환경변수 JWT_SECRET 으로 교체할 것)
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# 카카오 OAuth (운영 환경에서는 환경변수로 교체할 것)
kakao.client-id=${KAKAO_CLIENT_ID}
kakao.client-secret=${KAKAO_CLIENT_SECRET}
kakao.redirect-uri=https://remon-service-production.up.railway.app/api/auth/kakao/callback

# kakao.redirect-uri=http://localhost:8080/api/auth/kakao/callback

# 카카오 로그인 완료 후 프론트엔드 redirect URL
frontend.oauth-callback-url=https://remon-service.vercel.app/oauth-callback
# frontend.oauth-callback-url=http://localhost:3000/oauth-callback

# Gemini (운영 환경에서는 환경변수 GEMINI_API_KEY 로 교체할 것)
gemini.api-key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash
gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent
# 읽기 타임아웃 — 6000자 본문 생성은 30초를 넘는 경우가 있어 120초로 설정
gemini.timeout-ms=120000

# 책 생성 복구 — 이 시간보다 오래 PENDING/GENERATING 인 책은 FAILED + 레몬 환불
# (최악의 경우 Gemini 3회 x 120초 + 표지 생성 70초 ≈ 7.5분 이므로 여유를 둔 값)
book.generation.stale-after-minutes=15
book.generation.recovery-interval-ms=300000

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# OpenAI
openai.api-key=${OPENAI_API_KEY}

# Redis
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=300000
