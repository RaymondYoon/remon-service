# ── 테스트 전용 설정 (src/main/resources/application.properties 를 대체) ──────────
spring.application.name=remon-service-test

# H2 인메모리 DB (MySQL 호환 모드). `user` 테이블명이 H2 예약어라 NON_KEYWORDS 지정
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:remon;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,VALUE
spring.datasource.username=sa
spring.datasource.password=

# Flyway 마이그레이션은 MySQL 전용 문법이라 테스트에서는 끄고 스키마는 Hibernate가 생성
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Redis 없이 실행
spring.cache.type=none
spring.data.redis.repositories.enabled=false

jwt.secret=dGVzdFNlY3JldEtleUZvckp3dFRlc3RpbmdQdXJwb3NlLXJlbW9uLXNlcnZpY2U=
jwt.expiration=900000
jwt.refresh-expiration=604800000

kakao.client-id=test-client-id
